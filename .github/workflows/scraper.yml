name: Scraper Automático

on:
  schedule:
    # Horarios en UTC (Argentina = UTC-3).
    # Cada 20 min entre las 5 y las 10 hs, cuando se anuncian la mayoría de los paros.
    - cron: "*/20 8-12 * * *"
    # Cada 3 hs el resto del día.
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar scraper
        env:
          SCRAPER_URL: ${{ secrets.SCRAPER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SCRAPER_URL}/api/scraper"
